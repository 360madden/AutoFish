name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build desktop solution
        run: dotnet build AutoFish.sln --configuration Release

      - name: Validate fishing profiles
        shell: pwsh
        run: .\scripts\validate-profiles.ps1
