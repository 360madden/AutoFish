name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show .NET SDKs
        run: dotnet --info

      - name: Build desktop solution
        run: dotnet build AutoFish.sln --configuration Release

      - name: Validate fishing profiles
        shell: pwsh
        run: .\scripts\validate-profiles.ps1

      - name: Run Python helper checks
        shell: pwsh
        run: .\scripts\run-python-helper-checks.ps1
